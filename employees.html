<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Employees - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="employees.css">
</head>
<body data-module="employees">
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Employees</h2>
        </div>

        <button id="addEmployeeBtn" class="primary-btn" style="margin-bottom: 16px;">
            <i class="fa-solid fa-user-plus"></i> Add Employee
        </button>

        <div id="employeeForm" class="employee-form-card" style="display: none;">
            <div class="input-group">
                <label class="input-label">Name</label>
                <input type="text" id="empName" class="input-field" placeholder="e.g. Mohammed Salem" required>
            </div>

            <div class="input-group">
                <label class="input-label">Pay Type</label>
                <select id="empPayType" class="input-field">
                    <option value="salary">Salary</option>
                    <option value="percentage">Percentage of Jobs</option>
                </select>
            </div>

            <div id="salaryFields">
                <div class="input-group">
                    <label class="input-label">Salary Amount (LYD)</label>
                    <input type="number" id="empSalaryAmount" class="input-field" placeholder="e.g. 500" step="0.01">
                </div>
                <div class="input-group">
                    <label class="input-label">Salary Frequency</label>
                    <select id="empSalaryFrequency" class="input-field">
                        <option value="monthly">Monthly</option>
                        <option value="weekly">Weekly</option>
                        <option value="daily">Daily</option>
                    </select>
                </div>
            </div>

            <div id="percentageFields" style="display: none;">
                <div class="input-group">
                    <label class="input-label">Percentage Rate (%)</label>
                    <input type="number" id="empPercentageRate" class="input-field" placeholder="e.g. 10" step="0.01">
                </div>
            </div>

            <button id="saveEmployeeBtn" class="primary-btn">
                <i class="fa-solid fa-check"></i> Save Employee
            </button>
        </div>

        <div id="employeeList" class="fade-up"></div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="reports.html" class="nav-item" data-nav-module="reports">
                <i class="fa-solid fa-chart-line"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item" data-nav-module="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="permissions-guard.js"></script>
    <script src="employees.js"></script>
</body>
</html>
