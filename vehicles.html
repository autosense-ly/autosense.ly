<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vehicles Queue - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="vehicles.css">
</head>
<body data-module="live_operations">
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Vehicles Queue</h2>
            <a href="checkin.html" class="add-car-btn" data-nav-module="checkin">
                <i class="fa-solid fa-plus"></i> Add Car
            </a>
        </div>

        <div class="filter-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search plate, name...">
            </div>
            <div class="filter-pills">
                <button class="filter-pill active" data-filter="all">All (<span id="countAll">0</span>)</button>
                <button class="filter-pill" data-filter="waiting">Waiting (<span id="countWaiting">0</span>)</button>
                <button class="filter-pill" data-filter="washing">Washing (<span id="countWashing">0</span>)</button>
                <button class="filter-pill" data-filter="drying">Drying (<span id="countDrying">0</span>)</button>
                <button class="filter-pill" data-filter="completed">Completed (<span id="countCompleted">0</span>)</button>
                <button class="filter-pill" data-filter="delivered">Delivered (<span id="countDelivered">0</span>)</button>
            </div>
        </div>

        <div id="vehicleList" class="fade-up"></div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="reports.html" class="nav-item" data-nav-module="reports">
                <i class="fa-solid fa-chart-line"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item" data-nav-module="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="permissions-guard.js"></script>
    <script src="vehicles.js"></script>
</body>
</html>
