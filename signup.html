<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sign Up - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="page-container">
        <div class="login-content fade-up">
            <div class="login-brand">
                <div class="login-brand-icon">
                    <i class="fa-solid fa-car-wash"></i>
                </div>
                <span style="font-weight: 800; font-size: 16px; letter-spacing: -0.3px;">CarWash Pro</span>
            </div>

            <div class="login-header">
                <h2>Create Account</h2>
                <p>Set up your station control panel</p>
            </div>

            <div class="signup-toggle">
                <button type="button" class="signup-toggle-btn active" data-mode="owner">Start a Business</button>
                <button type="button" class="signup-toggle-btn" data-mode="manager">Join a Business</button>
            </div>

            <form id="signupForm" class="glass-card-form">
                <div class="input-group">
                    <label class="input-label">Your Name</label>
                    <input type="text" id="fullName" class="input-field-lux" placeholder="e.g. Ahmed Ali" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" id="email" class="input-field-lux" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" id="password" class="input-field-lux" placeholder="••••••••" required minlength="6">
                </div>

                <div class="input-group" id="businessIdGroup" style="display: none;">
                    <label class="input-label">Business ID</label>
                    <input type="text" id="businessId" class="input-field-lux" placeholder="Paste the ID your owner gave you">
                </div>

                <button type="submit" class="login-btn" id="signupSubmitBtn">Create Business Account</button>
            </form>

            <p class="signup-footer">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="signup.js"></script>
</body>
</html>
