<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reports - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/reports.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Analytics & Reports</h2>
        </div>

        <div class="report-metrics fade-up">
            <div class="report-box">
                <span class="report-label">Monthly Gross Revenue</span>
                <h3 class="report-value">₹5,42,000</h3>
                <span class="report-trend positive">+18% vs last month</span>
            </div>

            <div class="report-grid">
                <div class="metric-card">
                    <span class="metric-num">284</span>
                    <span class="metric-title">Total Washes</span>
                </div>
                <div class="metric-card">
                    <span class="metric-num">4.9 ★</span>
                    <span class="metric-title">Avg Rating</span>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/reports.js"></script>
</body>
</html>
