<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reports - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="reports.css">
</head>
<body data-module="reports">
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Analytics & Reports</h2>
        </div>

        <div class="report-metrics fade-up">
            <div class="report-box">
                <span class="report-label">Monthly Gross Revenue</span>
                <h3 class="report-value" id="reportRevenue">0.00 LYD</h3>
                <span class="report-trend positive" id="reportNetProfit">Net Profit: 0.00 LYD</span>
            </div>

            <div class="report-grid">
                <div class="metric-card">
                    <span class="metric-num" id="reportWashes">0</span>
                    <span class="metric-title">Total Washes</span>
                </div>
                <div class="metric-card">
                    <span class="metric-num" id="reportExpenses">0.00</span>
                    <span class="metric-title">Expenses (LYD)</span>
                </div>
                <div class="metric-card">
                    <span class="metric-num" id="reportEmployeePay">0.00</span>
                    <span class="metric-title">Employee Pay (LYD)</span>
                </div>
                <div class="metric-card">
                    <span class="metric-num" id="reportNetProfitCard">0.00</span>
                    <span class="metric-title">Net Profit (LYD)</span>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="reports.html" class="nav-item active">
                <i class="fa-solid fa-chart-line"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item" data-nav-module="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="permissions-guard.js"></script>
    <script src="reports.js"></script>
</body>
</html>
