<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Payments - CarWash Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/payments.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Billing & Collections</h2>
        </div>

        <div id="paymentList" class="fade-up">
            <div class="glass-item" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="font-size: 15px; font-weight: 700;">MH 12 AB 1234</h4>
                    <p style="font-size: 12px; color: #9ca3af;">Super Foam Wash</p>
                </div>
                <button class="pay-btn" style="background: #22c55e; color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer;">Collect ₹850</button>
            </div>

            <div class="glass-item" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="font-size: 15px; font-weight: 700;">DL 01 XY 9999</h4>
                    <p style="font-size: 12px; color: #9ca3af;">Interior Detailing</p>
                </div>
                <button class="pay-btn" style="background: #22c55e; color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer;">Collect ₹1,200</button>
            </div>
        </div>
    </div>
    <script src="../js/payments.js"></script>
</body>
</html>
