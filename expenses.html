<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expenses - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="expenses.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Expenses</h2>
        </div>

        <button id="addExpenseBtn" class="primary-btn" style="margin-bottom: 16px;">
            <i class="fa-solid fa-plus"></i> Add Expense
        </button>

        <div id="expenseForm" class="expense-form-card" style="display: none;">
            <div class="input-group">
                <label class="input-label">Expense Name</label>
                <input type="text" id="expName" class="input-field" placeholder="e.g. Soap Supplies" required>
            </div>

            <div class="input-group">
                <label class="input-label">Amount (LYD)</label>
                <input type="number" id="expAmount" class="input-field" placeholder="e.g. 150" step="0.01" required>
            </div>

            <div class="input-group">
                <label class="input-label">Date</label>
                <input type="date" id="expDate" class="input-field" required>
            </div>

            <div class="input-group">
                <label class="input-label">Notes (optional)</label>
                <input type="text" id="expNotes" class="input-field" placeholder="Any extra detail">
            </div>

            <button id="saveExpenseBtn" class="primary-btn">
                <i class="fa-solid fa-check"></i> Save Expense
            </button>
        </div>

        <div id="expenseTotal" class="expense-total-card"></div>

        <div id="expenseList" class="fade-up"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="expenses.js"></script>
</body>
</html>
