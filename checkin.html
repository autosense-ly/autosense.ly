<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Add Car - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="checkin.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="vehicles.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Add Car</h2>
        </div>

        <div class="checkin-card fade-up">
            <form id="checkinForm">
                <div class="input-group">
                    <label class="input-label">Vehicle Registration Number</label>
                    <input type="text" id="vNumber" class="input-field" placeholder="e.g. 123 ABC" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Car Model</label>
                    <input type="text" id="vModel" class="input-field" placeholder="e.g. Toyota Corolla" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Customer Name</label>
                    <input type="text" id="vOwner" class="input-field" placeholder="e.g. Ahmed Ali">
                </div>

                <div class="input-group">
                    <label class="input-label">Phone Number</label>
                    <input type="tel" id="vPhone" class="input-field" placeholder="+218 91 234 5678">
                </div>

                <div class="input-group">
                    <label class="input-label">Select Service</label>
                    <select id="vService" class="input-field">
                        <option value="">Loading services...</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn" style="margin-top: 10px;">
                    <i class="fa-solid fa-car"></i> Add Car
                </button>
            </form>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="checkin.js"></script>
</body>
</html>
