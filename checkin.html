<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Check In - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/checkin.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Vehicle Check In</h2>
        </div>

        <div class="checkin-card fade-up">
            <form id="checkinForm">
                <div class="input-group">
                    <label class="input-label">Vehicle Registration Number</label>
                    <input type="text" id="vNumber" class="input-field" placeholder="e.g. MH 02 CD 4567" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Customer Name</label>
                    <input type="text" id="vOwner" class="input-field" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Phone Number</label>
                    <input type="tel" id="vPhone" class="input-field" placeholder="+91 9876543210">
                </div>

                <div class="input-group">
                    <label class="input-label">Select Service</label>
                    <select id="vService" class="input-field">
                        <option value="Super Foam Wash">Super Foam Wash - ₹850</option>
                        <option value="Interior Deep Cleaning">Interior Deep Cleaning - ₹1,200</option>
                        <option value="Full Ceramic Coating">Full Ceramic Coating - ₹4,500</option>
                        <option value="Engine Bay Detail">Engine Bay Detail - ₹650</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn" style="margin-top: 10px;">
                    <i class="fa-solid fa-qrcode"></i> Complete Vehicle Check In
                </button>
            </form>
        </div>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/checkin.js"></script>
</body>
</html>
