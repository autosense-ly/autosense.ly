<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Services - CarWash Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="services.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Services</h2>
        </div>

        <button id="addServiceBtn" class="primary-btn" style="margin-bottom: 16px;">
            <i class="fa-solid fa-plus"></i> Add Service
        </button>

        <div class="filter-pills" style="margin-bottom: 16px;">
            <button class="filter-pill active" data-filter="all">All (<span id="countAll">0</span>)</button>
            <button class="filter-pill" data-filter="active">Active (<span id="countActive">0</span>)</button>
            <button class="filter-pill" data-filter="disabled">Disabled (<span id="countDisabled">0</span>)</button>
        </div>

        <div id="serviceForm" class="service-form-card" style="display: none;">
            <div class="input-group">
                <label class="input-label">Service Name</label>
                <input type="text" id="svcName" class="input-field" placeholder="e.g. Basic Wash" required>
            </div>

            <div class="input-group">
                <label class="input-label">Price (LYD)</label>
                <input type="number" id="svcPrice" class="input-field" placeholder="e.g. 20" step="0.01" required>
            </div>

            <button id="saveServiceBtn" class="primary-btn">
                <i class="fa-solid fa-check"></i> Save Service
            </button>
        </div>

        <div id="serviceList" class="fade-up"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
    <script src="services.js"></script>
</body>
</html>
